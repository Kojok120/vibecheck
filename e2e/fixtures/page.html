<!doctype html>
<meta charset="utf-8" />
<title>Test app</title>
<style>
  :root { --line: #e8e6f2; --muted: #6f6890; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 ui-sans-serif, -apple-system, "Hiragino Sans", system-ui, sans-serif;
         background: #f6f5fb; color: #1d1a2b; display: grid; grid-template-columns: 216px 1fr; min-height: 100vh; }
  nav { background: #1d1a2b; color: #cfcae6; padding: 18px 14px; }
  nav .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; color: #fff; font-size: 15px; margin-bottom: 22px; }
  nav .brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#8b5cf6,#5b5bd6); display: block; }
  nav a { display: block; padding: 7px 10px; border-radius: 7px; color: #cfcae6; text-decoration: none; font-size: 13.5px; }
  nav a.on { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); background: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header .actions { display: flex; gap: 8px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button.primary { background: #5b5bd6; border-color: #5b5bd6; color: #fff; font-weight: 600; }
  main { padding: 24px 28px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card span { display: block; font-size: 12px; color: var(--muted); }
  .card b { font-size: 24px; letter-spacing: -.01em; }
  #totals { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 6px 18px; max-width: 460px; }
  #totals .row { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  #totals .row:last-child { border-bottom: 0; }
  #totals .amount { font-size: 30px; font-weight: 800; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 22px; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  th { background: #faf9fe; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  .pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #e8f7ee; color: #1c7a45; }
  .pill.warn { background: #fdf0e3; color: #9a5b12; }
</style>
<nav>
  <div class="brand"><i></i>Acme</div>
  <a class="on" href="#">Dashboard</a>
  <a href="#">Orders</a>
  <a href="#">Customers</a>
  <a href="#">Settings</a>
</nav>
<div>
  <header>
    <h1>Dashboard</h1>
    <div class="actions"><button>Export</button><button class="primary">New order</button></div>
  </header>
  <main>
    <div class="cards">
      <div class="card"><span>Active users</span><b>4,182</b></div>
      <div class="card"><span>Conversion</span><b>3.4%</b></div>
      <div class="card"><span>Avg. order</span><b>¥6,280</b></div>
    </div>
    <h2>This month</h2>
    <section id="totals">
      <div class="row"><span>Revenue</span><span class="amount">1234567</span></div>
      <div class="row"><span>Orders</span><span class="amount">9821</span></div>
      <div class="row"><span>Refunds</span><span class="amount">312</span></div>
    </section>
    <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>#10482</td><td>Sato Rin</td><td>12800</td><td><span class="pill">Shipped</span></td></tr>
        <tr><td>#10481</td><td>Alex Mercer</td><td>4200</td><td><span class="pill warn">Pending</span></td></tr>
        <tr><td>#10480</td><td>Wang Yu</td><td>31500</td><td><span class="pill">Shipped</span></td></tr>
      </tbody>
    </table>
  </main>
</div>
